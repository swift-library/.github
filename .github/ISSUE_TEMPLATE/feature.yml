name: Feature request
description: Propose a change in behavior.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result and any compatibility implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
