name: Source policy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/policy.yml
    with:
      allow-terms: |
        ChatGPT
        Codex
        Cursor
        Claude
