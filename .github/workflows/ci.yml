name: Shared standards validation

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the icon generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: showxu/skills
          ref: e12d9066ce96dea5c00ef33bec6cd96f65adae78
          path: .build/icon-generator
          persist-credentials: false
      - name: Lint palettes and check published logos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/check-icons.py --generator .build/icon-generator/skills/apple-framework-icon-design/scripts/design_icons.py

  result:
    needs: icons
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the workflow validator
        env:
          GOBIN: ${{ runner.temp }}/workflow-tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Require published icons to match
        env:
          ICON_RESULT: ${{ needs.icons.result }}
        run: test "$ICON_RESULT" = success
      - name: Validate shared standards
        run: Scripts/check
