name: Shared standards validation

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    uses: ./.github/workflows/policy.yml
    with:
      allow-terms: |
        ChatGPT
        Codex
        Cursor
        Claude

  result:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the workflow validator
        env:
          GOBIN: ${{ runner.temp }}/workflow-tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Validate shared standards
        run: Scripts/check
