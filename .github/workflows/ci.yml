name: Shared standards validation

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  organization:
    uses: swift-library/github-workflows/.github/workflows/organization.yml@13b7e934da06a98f1b4ee11bd09cba85c84f458c
    with:
      organization: swift-library
      declaration-repository: ${{ github.repository }}
      declaration-revision: ${{ github.sha }}
      mode: public

  result:
    needs: organization
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require organization checks to succeed
        env:
          ORGANIZATION_RESULT: ${{ needs.organization.result }}
        run: test "$ORGANIZATION_RESULT" = success
