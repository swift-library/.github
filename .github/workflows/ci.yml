name: Shared standards validation

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  icons:
    uses: ./.github/workflows/icon-audit.yml

  result:
    needs: icons
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the workflow validator
        env:
          GOBIN: ${{ runner.temp }}/workflow-tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Require published icons to match
        env:
          ICON_RESULT: ${{ needs.icons.result }}
        run: test "$ICON_RESULT" = success
      - name: Validate shared standards
        run: Scripts/check
