name: Published icon audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the icon generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: showxu/skills
          ref: e12d9066ce96dea5c00ef33bec6cd96f65adae78
          path: .build/icon-generator
          persist-credentials: false
      - name: Lint palettes and check published logos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/check-icons.py --generator .build/icon-generator/skills/apple-framework-icon-design/scripts/design_icons.py
