name: Swift package validation

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: .github/release.json
      ref:
        type: string
        default: ''
    outputs:
      commit:
        description: Validated source commit
        value: ${{ jobs.configure.outputs.commit }}

permissions:
  contents: read

jobs:
  result:
    runs-on: ubuntu-24.04
    needs: [configure, check]
    if: always()
    steps:
      - name: Require all validation jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation did not succeed: ' + ', '.join(failed))
          print('All validation jobs passed')
          PY

  configure:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}
      command: ${{ steps.configuration.outputs.command }}
      commit: ${{ steps.configuration.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: configuration
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          config = json.loads(pathlib.Path(os.environ['CONFIGURATION']).read_text())
          matrix = config['ci']
          if not matrix.get('include'):
              raise SystemExit('The CI matrix must have at least one entry')
          for entry in matrix['include']:
              timeout = entry.setdefault('timeout_minutes', 45)
              if type(timeout) is not int or not 1 <= timeout <= 360:
                  raise SystemExit('CI timeout_minutes must be an integer from 1 to 360')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(matrix, separators=(',', ':')), file=output)
              print('command=' + config['check_command'], file=output)
              print('commit=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), file=output)
          PY

  check:
    needs: configure
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configure.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the declared Xcode
        if: matrix.xcode != ''
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          expected = os.environ['XCODE_VERSION']
          for app in sorted(pathlib.Path('/Applications').glob('Xcode*.app')):
              info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
              if info.get('CFBundleShortVersionString') == expected:
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      print('DEVELOPER_DIR=' + str(app / 'Contents/Developer'), file=output)
                  break
          else:
              raise SystemExit('Requested Xcode is not installed: ' + expected)
          PY
      - name: Install the declared macOS Swift toolchain
        if: matrix.swift != ''
        env:
          SWIFT_VERSION: ${{ matrix.swift }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == macOS ]]
          [[ "$SWIFT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package="$RUNNER_TEMP/swift-$SWIFT_VERSION.pkg"
          curl --fail --location --retry 3 --output "$package" \
            "https://download.swift.org/swift-$SWIFT_VERSION-release/xcode/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-osx.pkg"
          pkgutil --check-signature "$package"
          sudo installer -pkg "$package" -target /
          toolchain="/Library/Developer/Toolchains/swift-$SWIFT_VERSION-RELEASE.xctoolchain"
          "$toolchain/usr/bin/swift" --version
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
          identifier=$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")
          echo "TOOLCHAINS=$identifier" >> "$GITHUB_ENV"
      - name: Validate the package
        env:
          CHECK_COMMAND: ${{ matrix.command || needs.configure.outputs.command }}
          VALIDATION_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p .build/release-validation
          bash -eo pipefail -c "$CHECK_COMMAND" 2>&1 | tee .build/release-validation/check.log
      # Begin generated version validator.
      - name: Validate version and compiler declarations
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          mkdir -p .build/shared .build/release-validation
          cat > .build/shared/validate-version <<'PY'
          #!/usr/bin/env python3
          # SPDX-License-Identifier: Apache-2.0 WITH Swift-exception
          # Copyright (c) 2026 Xudong Xu

          """Check package-owned version inputs without changing them."""

          import argparse
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys


          VERSION = re.compile(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?"
          )


          def git(root, *arguments):
              return subprocess.check_output(["git", "-C", str(root), *arguments], text=True).strip()


          def compiler_version(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", value):
                  raise ValueError("Swift versions must use major.minor or major.minor.patch")
              return tuple(int(part) for part in value.split(".")) + (0,) * (3 - len(value.split(".")))


          def validate_compilers(root, config):
              minimum = compiler_version(config["minimum_swift"])
              if minimum < (6, 0, 0):
                  raise ValueError("minimum_swift must be at least 6.0")
              manifest = (root / "Package.swift").read_text()
              match = re.search(r"^// swift-tools-version:\s*([0-9]+\.[0-9]+(?:\.[0-9]+)?)\s*$", manifest, re.M)
              if not match or compiler_version(match[1]) != minimum:
                  raise ValueError("minimum_swift must equal swift-tools-version")
              compilers = []
              for entry in config["ci"]["include"]:
                  match = re.search(r"(?:^|-)swift-([0-9]+\.[0-9]+(?:\.[0-9]+)?)(?:$|-)", entry["name"])
                  if match:
                      declared = compiler_version(match[1])
                      if entry.get("swift") and compiler_version(entry["swift"])[:2] != declared[:2]:
                          raise ValueError("CI compiler name must match its installed Swift toolchain")
                      compilers.append(declared)
              if not compilers or min(compilers) != minimum:
                  raise ValueError("minimum_swift must equal the oldest tested CI compiler")


          def validate_tag(root, tag, version, repository, commit):
              reference = "refs/tags/" + tag
              if tag != "v" + version:
                  raise ValueError("Tag must match v" + version)
              if git(root, "cat-file", "-t", reference) != "tag":
                  raise ValueError("Release tag must be signed and annotated")
              if git(root, "rev-parse", reference + "^{commit}") != commit:
                  raise ValueError("Release tag must resolve to the candidate commit")
              message = git(root, "cat-file", "tag", reference).split("\n\n", 1)[1]
              message = re.split(r"-----BEGIN (?:SSH|PGP) SIGNATURE-----", message)[0].strip()
              if message != repository.split("/")[1] + " " + version:
                  raise ValueError("Tag message must be <repository> X.Y.Z")
              subprocess.run(["git", "-C", str(root), "verify-tag", reference], check=True)


          def validate(root, tag=None, require_clean=False, configuration=".github/release.json"):
              root = Path(root).resolve()
              config = json.loads((root / configuration).read_text())
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", config["repository"]):
                  raise ValueError("Expected a canonical owner/repository identity")
              validate_compilers(root, config)
              source = (root / config["version_file"]).read_text()
              matches = re.findall(config["version_pattern"], source)
              if len(matches) != 1 or not isinstance(matches[0], str) or not VERSION.fullmatch(matches[0]):
                  raise ValueError("Expected one canonical SemVer declaration")
              version = matches[0]
              changelog = (root / config["changelog"]).read_text()
              entries = list(re.finditer(r"^## (\S+)\s*$", changelog, re.MULTILINE))
              selected = [i for i, entry in enumerate(entries) if entry[1] == version]
              if len(selected) != 1:
                  raise ValueError("Expected exactly one Changelog entry for " + version)
              index = selected[0]
              start = entries[index].end()
              end = entries[index + 1].start() if index + 1 < len(entries) else len(changelog)
              notes = changelog[start:end].strip()
              if not notes:
                  raise ValueError("Release notes must describe the shipped behavior")
              dirty = bool(git(root, "status", "--porcelain", "--untracked-files=normal"))
              if require_clean and dirty:
                  raise ValueError("Release acceptance requires a clean committed source tree")
              commit = git(root, "rev-parse", "HEAD")
              if tag is not None:
                  validate_tag(root, tag, version, config["repository"], commit)
              lock = root / "Package.resolved"
              result = {
                  "repository": config["repository"],
                  "version": version,
                  "minimum_swift": config["minimum_swift"],
                  "tag": "v" + version,
                  "commit": commit,
                  "tree": git(root, "rev-parse", "HEAD^{tree}"),
                  "dirty": dirty,
                  "dependency_lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest() if lock.exists() else None,
                  "checker_sha256": hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
              }
              return result, notes


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--root", type=Path, default=Path.cwd())
              parser.add_argument("--configuration", default=".github/release.json")
              parser.add_argument("--tag")
              parser.add_argument("--require-clean", action="store_true")
              parser.add_argument("--notes", type=Path)
              parser.add_argument("--json", action="store_true")
              args = parser.parse_args()
              try:
                  result, notes = validate(args.root, args.tag, args.require_clean, args.configuration)
                  if args.notes:
                      args.notes.parent.mkdir(parents=True, exist_ok=True)
                      args.notes.write_text(notes + "\n")
                  print(json.dumps(result, indent=2) if args.json else result["version"])
              except (OSError, ValueError, KeyError, subprocess.CalledProcessError) as error:
                  print("validate-version: " + str(error), file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python3 .build/shared/validate-version --require-clean --json --configuration "$CONFIGURATION" > .build/release-validation/version.json
      # End generated version validator.
      # Begin generated evidence gate.
      - name: Check validation evidence
        id: evidence
        if: always()
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          # SPDX-License-Identifier: Apache-2.0 WITH Swift-exception
          """Normalize execution paths and reject private context in uploadable text."""

          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import tarfile

          # Product identifiers and source filenames are meaningful evidence, not attribution.
          PRIVATE_PATH = re.compile(r"/(?:Users|home)/[^/\s]+/|\.(?:workspace|agent)/|(?:^|[\s/])(?:[^\s/]+\.plan\.md|PLANS\.md)(?:$|[\s:])")


          def findings(data, name):
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  return []
              return [f"{name}:{number}: private execution path or plan reference"
                      for number, line in enumerate(text.splitlines(), 1) if PRIVATE_PATH.search(line)]


          def normalize_text(data, replacements):
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  return data
              for source, value in replacements:
                  text = text.replace(source, value)
              return text.encode("utf-8")


          def normalize_archive(data, name, replacements, depth=0):
              if depth > 4:
                  return data, [f"{name}: nested archive depth exceeds the evidence check limit"]
              errors = []
              changed = False
              output = io.BytesIO()
              mode = "w:gz" if name.endswith((".tar.gz", ".tgz")) else "w"
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:*") as archive, \
                      tarfile.open(fileobj=output, mode=mode) as normalized:
                  for member in archive:
                      label = name + "!" + member.name
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                          errors.append(f"{label}: unsafe archive member")
                          continue
                      if member.isfile():
                          content = archive.extractfile(member).read()
                          if member.name.endswith((".tar.gz", ".tgz", ".tar")):
                              replacement, nested_errors = normalize_archive(content, label, replacements, depth + 1)
                              errors.extend(nested_errors)
                          else:
                              replacement = normalize_text(content, replacements)
                              errors.extend(findings(replacement, label))
                          changed |= content != replacement
                          member.size = len(replacement)
                          normalized.addfile(member, io.BytesIO(replacement))
                      else:
                          normalized.addfile(member)
              return (output.getvalue() if changed and not errors else data), errors


          def check(directory, replacements):
              """Normalize UTF-8 files and archive contents before checking for private paths."""
              errors = []
              if not directory.is_dir():
                  return ["Validation evidence directory is missing"]
              replacements = sorted(((source, value) for source, value in replacements if len(source) > 1),
                                    key=lambda pair: len(pair[0]), reverse=True)
              for path in sorted(directory.rglob("*")):
                  name = path.relative_to(directory).as_posix()
                  if path.is_symlink():
                      errors.append(f"{name}: evidence must not contain symbolic links")
                      continue
                  if not path.is_file():
                      continue
                  content = path.read_bytes()
                  if path.suffix == ".log":
                      try:
                          content.decode("utf-8")
                      except UnicodeDecodeError:
                          errors.append(f"{name}: log is not UTF-8")
                          continue
                  if name == "package.json":
                      manifest = json.loads(content)
                      package_kind = manifest.get("packageKind", {})
                      if package_kind.get("root") == [str(Path.cwd())]:
                          package_kind["root"] = ["."]
                          content = (json.dumps(manifest, indent=2) + "\n").encode()
                  errors.extend(findings(name.encode(), name))
                  if path.name.endswith((".tar.gz", ".tgz", ".tar")):
                      content, archive_errors = normalize_archive(content, name, replacements)
                      errors.extend(archive_errors)
                  else:
                      content = normalize_text(content, replacements)
                      errors.extend(findings(content, name))
                  if content != path.read_bytes():
                      path.write_bytes(content)
              return errors


          def main():
              replacements = [(str(Path.cwd()), "<package>"), (str(Path.home()), "<home>")]
              for key in ("RUNNER_TEMP", "TMPDIR"):
                  if os.environ.get(key):
                      replacements.append((os.environ[key].rstrip("/"), "<temporary>"))
              errors = check(Path(".build/release-validation"), replacements)
              if errors:
                  raise SystemExit("\n".join(errors))
              print("validation evidence paths checked")


          if __name__ == "__main__":
              main()
          PY
      # End generated evidence gate.
      - name: Preserve validation evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.name }}
          path: .build/release-validation/
          if-no-files-found: error
          retention-days: 30
