name: Swift package publication

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      accepted_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Begin generated version validator.
      - name: Validate version and compiler declarations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTED_COMMIT: ${{ inputs.accepted_commit }}
        run: |
          set -euo pipefail
          mkdir -p .build/shared .build/release-validation
          cat > .build/shared/validate-version <<'PY'
          #!/usr/bin/env python3
          # SPDX-License-Identifier: Apache-2.0 WITH Swift-exception
          # Copyright (c) 2026 Xudong Xu

          """Check package-owned version inputs without changing them."""

          import argparse
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys


          VERSION = re.compile(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-(?:alpha|beta|rc)\.[1-9][0-9]*)?"
          )


          def git(root, *arguments):
              return subprocess.check_output(["git", "-C", str(root), *arguments], text=True).strip()


          def compiler_version(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", value):
                  raise ValueError("Swift versions must use major.minor or major.minor.patch")
              return tuple(int(part) for part in value.split(".")) + (0,) * (3 - len(value.split(".")))


          def validate_compilers(root, config):
              minimum = compiler_version(config["minimum_swift"])
              if minimum < (6, 0, 0):
                  raise ValueError("minimum_swift must be at least 6.0")
              manifest = (root / "Package.swift").read_text()
              match = re.search(r"^// swift-tools-version:\s*([0-9]+\.[0-9]+(?:\.[0-9]+)?)\s*$", manifest, re.M)
              if not match or compiler_version(match[1]) != minimum:
                  raise ValueError("minimum_swift must equal swift-tools-version")
              compilers = []
              for entry in config["ci"]["include"]:
                  match = re.search(r"(?:^|-)swift-([0-9]+\.[0-9]+(?:\.[0-9]+)?)(?:$|-)", entry["name"])
                  if match:
                      declared = compiler_version(match[1])
                      if entry.get("swift") and compiler_version(entry["swift"])[:2] != declared[:2]:
                          raise ValueError("CI compiler name must match its installed Swift toolchain")
                      compilers.append(declared)
              if not compilers or min(compilers) != minimum:
                  raise ValueError("minimum_swift must equal the oldest tested CI compiler")


          def validate_tag(root, tag, version, repository, commit):
              reference = "refs/tags/" + tag
              if tag != "v" + version:
                  raise ValueError("Tag must match v" + version)
              if git(root, "cat-file", "-t", reference) != "tag":
                  raise ValueError("Release tag must be signed and annotated")
              if git(root, "rev-parse", reference + "^{commit}") != commit:
                  raise ValueError("Release tag must resolve to the candidate commit")
              message = git(root, "cat-file", "tag", reference).split("\n\n", 1)[1]
              message = re.split(r"-----BEGIN (?:SSH|PGP) SIGNATURE-----", message)[0].strip()
              if message != repository.split("/")[1] + " " + version:
                  raise ValueError("Tag message must be <repository> X.Y.Z")
              subprocess.run(["git", "-C", str(root), "verify-tag", reference], check=True)


          def validate(root, tag=None, require_clean=False, configuration=".github/release.json"):
              root = Path(root).resolve()
              config = json.loads((root / configuration).read_text())
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", config["repository"]):
                  raise ValueError("Expected a canonical owner/repository identity")
              validate_compilers(root, config)
              source = (root / config["version_file"]).read_text()
              matches = re.findall(config["version_pattern"], source)
              if len(matches) != 1 or not isinstance(matches[0], str) or not VERSION.fullmatch(matches[0]):
                  raise ValueError("Expected one canonical SemVer declaration")
              version = matches[0]
              changelog = (root / config["changelog"]).read_text()
              entries = list(re.finditer(r"^## (\S+)\s*$", changelog, re.MULTILINE))
              selected = [i for i, entry in enumerate(entries) if entry[1] == version]
              if len(selected) != 1:
                  raise ValueError("Expected exactly one Changelog entry for " + version)
              index = selected[0]
              start = entries[index].end()
              end = entries[index + 1].start() if index + 1 < len(entries) else len(changelog)
              notes = changelog[start:end].strip()
              if not notes:
                  raise ValueError("Release notes must describe the shipped behavior")
              dirty = bool(git(root, "status", "--porcelain", "--untracked-files=normal"))
              if require_clean and dirty:
                  raise ValueError("Release acceptance requires a clean committed source tree")
              commit = git(root, "rev-parse", "HEAD")
              if tag is not None:
                  validate_tag(root, tag, version, config["repository"], commit)
              lock = root / "Package.resolved"
              result = {
                  "repository": config["repository"],
                  "version": version,
                  "minimum_swift": config["minimum_swift"],
                  "tag": "v" + version,
                  "commit": commit,
                  "tree": git(root, "rev-parse", "HEAD^{tree}"),
                  "dirty": dirty,
                  "dependency_lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest() if lock.exists() else None,
                  "checker_sha256": hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),
              }
              return result, notes


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--root", type=Path, default=Path.cwd())
              parser.add_argument("--configuration", default=".github/release.json")
              parser.add_argument("--tag")
              parser.add_argument("--require-clean", action="store_true")
              parser.add_argument("--notes", type=Path)
              parser.add_argument("--json", action="store_true")
              args = parser.parse_args()
              try:
                  result, notes = validate(args.root, args.tag, args.require_clean, args.configuration)
                  if args.notes:
                      args.notes.parent.mkdir(parents=True, exist_ok=True)
                      args.notes.write_text(notes + "\n")
                  print(json.dumps(result, indent=2) if args.json else result["version"])
              except (OSError, ValueError, KeyError, subprocess.CalledProcessError) as error:
                  print("validate-version: " + str(error), file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          test "$(git rev-parse HEAD)" = "$ACCEPTED_COMMIT"
          gh api users/showxu/ssh_signing_keys --jq '.[] | "10173746+showxu@users.noreply.github.com " + .key' > .build/shared/allowed-signers
          git config gpg.ssh.allowedSignersFile .build/shared/allowed-signers
          python3 .build/shared/validate-version --require-clean --json --tag "$RELEASE_TAG" --notes .build/release-validation/release-notes.md > .build/release-validation/version.json
      # End generated version validator.
      - name: Prepare verified evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir .build/ci-evidence
          python3 - <<'PY'
          import gzip, pathlib, tarfile
          root = pathlib.Path('.build/ci-evidence')
          with open('.build/release-validation/validation-evidence.tar.gz', 'wb') as raw:
              with gzip.GzipFile(fileobj=raw, mode='wb', mtime=0, filename='') as compressed:
                  with tarfile.open(fileobj=compressed, mode='w') as archive:
                      for path in sorted(root.rglob('*')):
                          if path.is_file():
                              info = archive.gettarinfo(str(path), arcname=str(path.relative_to(root)))
                              info.mtime = info.uid = info.gid = 0
                              info.uname = info.gname = ''
                              with path.open('rb') as source:
                                  archive.addfile(info, source)
          PY
      # Begin generated API publication.
      - name: Prepare release API evidence
        env:
          ACCEPTED_COMMIT: ${{ inputs.accepted_commit }}
        run: |
          mkdir -p .build/shared
          cat > .build/shared/api-evidence.py <<'PY'
          #!/usr/bin/env python3
          # SPDX-License-Identifier: Apache-2.0 WITH Swift-exception
          """Collect release-bound interface evidence and report observations without gating."""

          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tarfile
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          TOOL = {
              'repository': 'swift-library/swift-interface-distiller',
              'version': '0.2.0',
              'commit': 'c6269c2d3707a599c613748c44130aa24afb15b8',
              'archive_sha256': '40a1e9c6d29413809298e1a0efad69129b559b2fab6ad3a2b2fe994df2294dda',
          }
          ASSET = 'api-evidence.json'
          LIMIT = 256 * 1024 * 1024


          class Unavailable(Exception):
              """An observation could not be made; this never means compatibility."""


          def write(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = path.with_suffix('.tmp')
              temporary.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n')
              temporary.replace(path)


          def read_url(url, token=None, accept='application/octet-stream'):
              headers = {'Accept': accept}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              with urlopen(Request(url, headers=headers), timeout=60) as response:
                  content = response.read(LIMIT + 1)
              if len(content) > LIMIT:
                  raise Unavailable('Download exceeds the evidence size limit')
              return content


          class GitHub:
              def __init__(self, repository):
                  self.repository = repository

              def get(self, suffix):
                  return json.loads(read_url('https://api.github.com/repos/' + self.repository + suffix,
                                            os.environ.get('GH_TOKEN'), accept='application/vnd.github+json'))

              def latest(self):
                  try:
                      return self.get('/releases/latest')
                  except HTTPError as error:
                      if error.code == 404:
                          return None
                      raise

              def commit(self, tag):
                  return self.get('/commits/' + quote(tag, safe=''))['sha']

              def asset(self, asset):
                  expected = 'https://github.com/' + self.repository + '/releases/download/'
                  url = asset['browser_download_url']
                  if not url.startswith(expected):
                      raise Unavailable('Release asset has an unexpected download origin')
                  content = read_url(url)
                  if asset.get('digest') != 'sha256:' + hashlib.sha256(content).hexdigest():
                      raise Unavailable('Release asset digest could not be verified')
                  return json.loads(content)


          def envelope(repository, commit, status='failed', reason='Collection did not finish', evidence=None):
              return {'schema_version': 1, 'repository': repository, 'commit': commit,
                      'collector': TOOL, 'status': status, 'reason': reason, 'evidence': evidence}


          def validate(value, repository, commit):
              if value.get('schema_version') != 1:
                  raise Unavailable('Unsupported API evidence envelope schema')
              if value.get('repository') != repository or value.get('commit') != commit:
                  raise Unavailable('API evidence does not match its repository and tag commit')
              if value.get('status') not in ('complete', 'incomplete', 'failed'):
                  raise Unavailable('Unknown API collection status')
              if value['status'] == 'complete':
                  snapshot = value.get('evidence')
                  if not isinstance(snapshot, dict) or not snapshot.get('configurations'):
                      raise Unavailable('Complete API evidence has no configurations')
              return value


          def baseline(api):
              release = api.latest()
              if release is None:
                  return None, {'status': 'missing', 'reason': 'No published stable release'}
              identity = {'tag': release['tag_name'], 'release_id': release['id']}
              if release.get('draft') or release.get('prerelease'):
                  raise Unavailable('Latest baseline must be a published stable release')
              assets = [asset for asset in release['assets'] if asset['name'] == ASSET]
              if not assets:
                  return None, {**identity, 'status': 'missing', 'reason': 'Latest release has no API evidence asset'}
              if len(assets) != 1:
                  raise Unavailable('Latest release must have exactly one API evidence asset')
              commit = api.commit(release['tag_name'])
              value = validate(api.asset(assets[0]), api.repository, commit)
              return value, {**identity, 'commit': commit, 'asset_id': assets[0]['id'],
                             'asset_digest': assets[0]['digest'],
                             'status': value['status'], 'source': 'release-asset', 'collector': value.get('collector')}


          def run(arguments, root, log, timeout=3600, allowed=(0,)):
              environment = {key: value for key, value in os.environ.items()
                             if key not in ('GH_TOKEN', 'GITHUB_TOKEN')}
              with log.open('ab') as output:
                  result = subprocess.run([str(argument) for argument in arguments], cwd=root,
                                          env=environment, stdout=output, stderr=subprocess.STDOUT,
                                          timeout=timeout, check=False)
              if result.returncode not in allowed:
                  raise Unavailable(f'Compiler or collector command exited {result.returncode}; see collection log')
              return result.returncode


          def tool(root, scratch, log):
              archive = scratch / 'collector.tar.gz'
              archive.write_bytes(read_url('https://github.com/' + TOOL['repository']
                                          + '/archive/refs/tags/v' + TOOL['version'] + '.tar.gz'))
              if hashlib.sha256(archive.read_bytes()).hexdigest() != TOOL['archive_sha256']:
                  raise Unavailable('Collector source archive does not match its reviewed pin')
              source = scratch / 'collector'
              if source.exists():
                  shutil.rmtree(source)
              source.mkdir()
              with tarfile.open(archive) as contents:
                  members = contents.getmembers()
                  prefix = members[0].name.split('/')[0] + '/'
                  for member in members:
                      relative = member.name.removeprefix(prefix)
                      if member.name == prefix.rstrip('/'):
                          continue
                      if (not member.name.startswith(prefix) or Path(relative).is_absolute()
                              or '..' in Path(relative).parts or not (member.isdir() or member.isfile())):
                          raise Unavailable('Collector archive contains an unsafe member')
                      destination = source / relative
                      if member.isdir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          destination.write_bytes(contents.extractfile(member).read())
              run(['swift', 'build', '--build-system', 'native', '-c', 'release', '--product', 'interface-distiller'],
                  source, log, timeout=1200)
              return source / '.build/release/interface-distiller'


          def collect(executable, root, scratch, output, repository, commit):
              snapshot = scratch / 'snapshot.json'
              snapshot.unlink(missing_ok=True)
              log = output / 'collection.log'
              run([executable, 'collect', 'package', root, '--output', snapshot,
                   '--report', scratch / 'run.json', '--timeout', '3600'], root, log)
              evidence = json.loads(snapshot.read_text())
              status = run([executable, 'baseline', 'write', snapshot, scratch / 'validated.json'],
                           root, log, allowed=(0, 4))
              return envelope(repository, commit, 'complete' if status == 0 else 'incomplete',
                              'Collected library-product public/open interfaces' if status == 0
                              else 'Collection has gaps that prevent baseline acceptance', evidence)


          def collector_matches(value):
              if value.get('collector') != TOOL:
                  return False
              snapshot = value.get('evidence')
              return snapshot is None or all(
                  configuration.get('configuration', {}).get('extractorVersion') == TOOL['version']
                  for configuration in snapshot.get('configurations', [])
              )


          def content_digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()


          def baseline_cache_inputs(prior, identity):
              if prior is None or collector_matches(prior):
                  return None
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', identity.get('asset_digest') or ''):
                  raise Unavailable('Baseline cache requires a verified release asset digest')
              image = {name: os.environ[name] for name in ('ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH')}
              if not all(image.values()):
                  raise Unavailable('Baseline cache requires the complete runner image identity')
              commands = {'xcode': ['xcodebuild', '-version'], 'swift': ['swift', '--version'],
                          'sdk': ['xcrun', '--sdk', 'macosx', '--show-sdk-version']}
              toolchain = {name: subprocess.check_output(command, text=True).strip() for name, command in commands.items()}
              return {'schema_version': 1, 'repository': prior['repository'], 'release_commit': identity['commit'],
                      'attached_evidence_digest': identity['asset_digest'], 'collector': TOOL,
                      'runner_image': image, 'toolchain': toolchain}


          def baseline_cache_key(inputs):
              return 'api-release-baseline-v1-' + content_digest(inputs)


          def read_cached_baseline(path, inputs):
              if path.is_symlink() or path.stat().st_size > LIMIT:
                  raise Unavailable('Baseline cache file has an invalid type or size')
              record = json.loads(path.read_text())
              if record.get('schema_version') != 1 or record.get('inputs') != inputs:
                  raise Unavailable('Baseline cache inputs differ from the verified release and toolchain')
              value = validate(record['baseline'], inputs['repository'], inputs['release_commit'])
              if record.get('baseline_sha256') != content_digest(value):
                  raise Unavailable('Baseline cache content digest differs from its receipt')
              if value['status'] != 'complete' or not collector_matches(value):
                  raise Unavailable('Baseline cache must contain complete evidence from the pinned collector')
              return value


          def recollection_identity(identity, prior, value):
              return {**identity, 'source': 'recollected-release-tag', 'collector': TOOL,
                      'attached_collector': prior.get('collector'), 'status': value['status']}


          def recollect(prior, identity, executable, root, scratch, output):
              """Rebuild only the verified release commit, before executing candidate sources."""
              if prior is None or collector_matches(prior):
                  return prior, identity
              source = scratch / 'baseline-source'
              if source.exists():
                  shutil.rmtree(source)
              log = output / 'collection.log'
              run(['git', 'clone', '--no-checkout', '--filter=blob:none',
                   'https://github.com/' + prior['repository'] + '.git', source], root, log, timeout=300)
              run(['git', 'checkout', '--detach', identity['commit']], source, log, timeout=300)
              baseline_scratch = scratch / 'baseline-collection'
              baseline_scratch.mkdir(parents=True, exist_ok=True)
              value = collect(executable, source, baseline_scratch, output, prior['repository'], identity['commit'])
              if not collector_matches(value):
                  raise Unavailable('Recollected baseline does not match the pinned collector')
              return value, recollection_identity(identity, prior, value)


          def workflow_output(name, value):
              if os.environ.get('GITHUB_OUTPUT'):
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                      print(name + '=' + value, file=stream)


          def prepare_baseline(root, repository, commit, cache_enabled=False):
              scratch, output = root / '.build/shared-api', root / '.build/api-evidence'
              scratch.mkdir(parents=True, exist_ok=True)
              output.mkdir(parents=True, exist_ok=True)
              (output / 'collection.log').write_bytes(b'')
              started = time.monotonic()
              try:
                  prior, identity = baseline(GitHub(repository))
              except Exception as error:
                  prior, identity = None, {'status': 'unavailable', 'reason': type(error).__name__}
              inputs = None
              cache = {'status': 'disabled' if not cache_enabled else 'not-needed'}
              if cache_enabled:
                  try:
                      inputs = baseline_cache_inputs(prior, identity)
                  except Exception as error:
                      cache = {'status': 'disabled', 'reason': type(error).__name__}
              context = {'repository': repository, 'commit': commit, 'prior': prior, 'identity': identity,
                         'cache_inputs': inputs, 'cache': cache, 'prepare_seconds': time.monotonic() - started}
              write(scratch / 'baseline-context.json', context)
              workflow_output('cache_key', baseline_cache_key(inputs) if inputs else '')


          def baseline_context(root, repository, commit):
              value = json.loads((root / '.build/shared-api/baseline-context.json').read_text())
              if value['repository'] != repository or value['commit'] != commit:
                  raise Unavailable('Prepared baseline context belongs to another candidate')
              return value


          def recollect_baseline(root, repository, commit, executable=None):
              scratch, output = root / '.build/shared-api', root / '.build/api-evidence'
              context = baseline_context(root, repository, commit)
              prior, identity, inputs = context['prior'], context['identity'], context['cache_inputs']
              cached = scratch / 'baseline-cache/record.json'
              try:
                  executable = executable or tool(root, scratch, output / 'collection.log')
                  context['executable'] = str(executable)
                  started = time.monotonic()
                  value = None
                  if inputs:
                      context['cache'] = {'status': 'miss', 'key': baseline_cache_key(inputs)}
                      if cached.exists():
                          try:
                              value = read_cached_baseline(cached, inputs)
                              context['cache']['status'] = 'hit'
                          except Exception as error:
                              context['cache'].update(status='rejected', reason=str(error) if isinstance(error, Unavailable)
                                                      else type(error).__name__)
                  if value is not None:
                      identity = recollection_identity(identity, prior, value)
                      prior = value
                  else:
                      prior, identity = recollect(prior, identity, executable, root, scratch, output)
                      if inputs and prior['status'] == 'complete':
                          validate(prior, repository, inputs['release_commit'])
                          write(cached, {'schema_version': 1, 'inputs': inputs, 'baseline': prior,
                                         'baseline_sha256': content_digest(prior)})
                          if context['cache']['status'] == 'miss':
                              workflow_output('cache_ready', 'true')
                  context['cache']['seconds'] = time.monotonic() - started
              except Exception as error:
                  prior, identity = None, {**identity, 'status': 'unavailable',
                                          'reason': str(error) if isinstance(error, Unavailable) else type(error).__name__}
              context.update(prior=prior, identity=identity)
              write(scratch / 'baseline-context.json', context)


          def compare(candidate, prior, identity, executable, root, scratch, log):
              report = {'schema_version': 1, 'mode': 'report-only', 'repository': candidate['repository'],
                        'commit': candidate['commit'], 'baseline': identity, 'collection': candidate['status']}
              if candidate['status'] != 'complete':
                  return {**report, 'status': 'unavailable', 'reason': candidate['reason']}
              if prior is None or prior['status'] != 'complete':
                  return {**report, 'status': 'unavailable', 'reason': 'No complete release baseline'}
              if not collector_matches(candidate) or not collector_matches(prior):
                  return {**report, 'status': 'unavailable', 'reason': 'Collector versions differ; a release baseline must be recollected'}
              old, new = scratch / 'baseline.json', scratch / 'candidate.json'
              write(old, prior['evidence'])
              write(new, candidate['evidence'])
              difference = scratch / 'difference.json'
              run([executable, 'compare', old, new, '--output', difference], root, log, allowed=(0, 1))
              value = json.loads(difference.read_text())
              scope_changed = any(change['category'] == 'provenance' and change['path'] == '/scope'
                                  for change in value['changes'])
              incompatible = bool(value['incomparableConfigurations']) or scope_changed
              categories = {category: sum(change['category'] == category for change in value['changes'])
                            for category in ('interface', 'documentation', 'availability', 'provenance')}
              changed = bool(value['added'] or value['removed'] or value['changes'])
              return {**report, 'status': 'incomparable' if incompatible else 'changed' if changed else 'equal',
                      'counts': {'added': len(value['added']), 'removed': len(value['removed']), **categories},
                      'difference': value}


          def summary(report):
              lines = ['## Public interface evidence', '', '**Report only; no version or compatibility decision.**', '',
                       '- Collection: ' + report.get('collection', 'failed'), '- Comparison: ' + report['status']]
              identity = report.get('baseline', {})
              if identity.get('source') == 'recollected-release-tag':
                  lines += ['- Baseline: recollected from ' + identity['tag'] + ' (' + identity['commit']
                            + ') with collector ' + identity['collector']['version']]
              if identity.get('reason'):
                  lines += ['- Baseline: ' + identity['reason']]
              if report.get('baseline_cache'):
                  cache = report['baseline_cache']
                  lines += ['- Recollected baseline cache: ' + cache['status']]
                  if 'seconds' in cache:
                      lines += ['- Baseline selection/recollection: ' + format(cache['seconds'], '.3f') + ' seconds']
              if report.get('counts'):
                  lines += ['- ' + key + ': ' + str(count) for key, count in report['counts'].items()]
              lines += ['', 'See api-evidence.json and api-report.json for source identity, scope, gaps and field-level changes.', '']
              return '\n'.join(lines)


          def report(root, repository, commit, executable=None, prepared=False):
              output, scratch = root / '.build/api-evidence', root / '.build/shared-api'
              output.mkdir(parents=True, exist_ok=True)
              scratch.mkdir(parents=True, exist_ok=True)
              if not prepared:
                  (output / 'collection.log').write_bytes(b'')
              candidate = envelope(repository, commit)
              result = {'schema_version': 1, 'mode': 'report-only', 'repository': repository,
                        'commit': commit, 'collection': 'failed', 'status': 'unavailable'}
              # Capture the remote baseline before executing the caller's package manifest.
              context = None
              try:
                  if prepared:
                      context = baseline_context(root, repository, commit)
                      prior, identity = context['prior'], context['identity']
                      executable = Path(context['executable']) if context.get('executable') else None
                  else:
                      prior, identity = baseline(GitHub(repository))
              except Exception as error:
                  prior, identity = None, {'status': 'unavailable', 'reason': type(error).__name__}
              try:
                  if prepared and executable is None:
                      raise Unavailable('Collector was unavailable during baseline preparation')
                  executable = executable or tool(root, scratch, output / 'collection.log')
                  try:
                      if not prepared:
                          prior, identity = recollect(prior, identity, executable, root, scratch, output)
                  except Exception as error:
                      prior, identity = None, {**identity, 'status': 'unavailable',
                                              'reason': str(error) if isinstance(error, Unavailable) else type(error).__name__}
                  candidate = collect(executable, root, scratch, output, repository, commit)
                  result = compare(candidate, prior, identity, executable, root, scratch, output / 'collection.log')
              except Exception as error:
                  result.update(collection=candidate['status'], baseline=identity,
                                reason=str(error) if isinstance(error, Unavailable) else type(error).__name__)
                  if candidate['status'] == 'failed':
                      candidate['reason'] = result['reason']
              if context is not None:
                  result['baseline_cache'] = context['cache']
                  result['baseline_prepare_seconds'] = context['prepare_seconds']
              write(output / ASSET, candidate)
              write(output / 'api-report.json', result)
              markdown = summary(result)
              (output / 'api-report.md').write_text(markdown)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                      stream.write(markdown)
              print(markdown)


          def prepare(root, repository, commit):
              source = root / '.build/ci-evidence' / ('api-evidence-' + commit) / ASSET
              if source.is_file():
                  candidate = validate(json.loads(source.read_text()), repository, commit)
              else:
                  candidate = envelope(repository, commit, reason='API job did not upload evidence; inspect the workflow run')
              write(root / '.build/release-validation' / ASSET, candidate)


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('mode', choices=('collect', 'prepare-release', 'prepare-baseline', 'recollect-baseline'))
              parser.add_argument('--root', type=Path, default=Path.cwd())
              parser.add_argument('--executable', type=Path, help='Use an already built collector for local validation')
              parser.add_argument('--prepared-baseline', action='store_true', help='Use the baseline prepared before candidate execution')
              args = parser.parse_args()
              root = args.root.resolve()
              repository = os.environ['GITHUB_REPOSITORY']
              commit = os.environ.get('ACCEPTED_COMMIT') or subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository) or not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise SystemExit('Expected a repository identity and a full source commit')
              if args.mode == 'collect':
                  report(root, repository, commit, args.executable.resolve() if args.executable else None, args.prepared_baseline)
              elif args.mode == 'prepare-baseline':
                  prepare_baseline(root, repository, commit, os.environ.get('API_BASELINE_CACHE') == 'true')
              elif args.mode == 'recollect-baseline':
                  recollect_baseline(root, repository, commit, args.executable.resolve() if args.executable else None)
              else:
                  prepare(root, repository, commit)


          if __name__ == '__main__':
              main()
